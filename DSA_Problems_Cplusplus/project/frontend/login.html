<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width.initial-scale=1.0">
    <title>Login - Pakistan EMS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="flag-background">
        <div class="flag-green"></div>
        <div class="flag-white"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-vote-yea"></i>
                <span>Pakistan EMS</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="register.html" class="nav-link">Register</a></li>
                <li><a href="results.html" class="nav-link">Results</a></li>
            </ul>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="form-section">
        <div class="form-container fade-in-up" style="max-width: 500px;">
            <div class="form-header">
                <i class="fas fa-sign-in-alt"></i>
                <h2>Login</h2>
                <p>Access your account</p>
            </div>

            <!-- Tab Navigation -->
            <div class="login-tabs">
                <button class="tab-btn active" onclick="switchLoginTab('voter')">
                    <i class="fas fa-user"></i>
                    Voter Login
                </button>
                <button class="tab-btn" onclick="switchLoginTab('admin')">
                    <i class="fas fa-user-shield"></i>
                    Admin Login
                </button>
            </div>

            <!-- Voter Login Form -->
            <form id="voter-login-form" class="custom-form login-form active">
                <div class="form-group">
                    <label for="voter-cnic">
                        <i class="fas fa-id-card"></i>
                        CNIC Number
                    </label>
                    <input 
                        type="text" 
                        id="voter-cnic" 
                        name="cnic" 
                        required 
                        placeholder="Enter your 13-digit CNIC"
                        maxlength="13"
                        pattern="[0-9]{13}"
                        autocomplete="username"
                    >
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="voter-password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="voter-password" 
                            name="password" 
                            required 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('voter-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message"></span>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember">
                    <label for="remember-me">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i>
                    Login as Voter
                </button>

                <div class="form-footer">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </form>

            <!-- Admin Login Form -->
            <form id="admin-login-form" class="custom-form login-form">
                <div class="form-group">
                    <label for="admin-username">
                        <i class="fas fa-user-shield"></i>
                        Admin Username
                    </label>
                    <input 
                        type="text" 
                        id="admin-username" 
                        name="username" 
                        required 
                        placeholder="Enter admin username"
                        autocomplete="username"
                    >
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="admin-password">
                        <i class="fas fa-lock"></i>
                        Admin Password
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="admin-password" 
                            name="password" 
                            required 
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('admin-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message"></span>
                </div>

                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>This is a restricted area.Unauthorized access is prohibited.</span>
                </div>

                <button type="submit" class="btn btn-danger btn-block">
                    <i class="fas fa-shield-alt"></i>
                    Login as Admin
                </button>

                <div class="form-footer">
                    <p><a href="index.html">← Back to Home</a></p>
                </div>
            </form>

            <!-- Security Badge -->
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Secured with Blockchain Technology</span>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
